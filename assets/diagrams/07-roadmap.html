fff" stroke="#cbd4e2"/><text x="92" y="204" class="name" text-anchor="start">02  底座筑基</text><text x="92" y="228" class="sub" text-anchor="start">建立工程平台、上下文、评测与护栏</text><rect x="76" y="264" width="580" height="64" rx="6" fill="#fff" stroke="#cbd4e2"/><text x="92" y="292" class="name" text-anchor="start">03  小队重组</text><text x="92" y="316" class="sub" text-anchor="start">组成常设 Pod，把绩效对齐业务成果</text><rect x="76" y="352" width="580" height="64" rx="6" fill="#fff" stroke="#cbd4e2"/><text x="92" y="380" class="name" text-anchor="start">04  渐进演进</text><text x="92" y="404" class="sub" text-anchor="start">分级自治，每次交付沉淀双价值流</text><rect x="76" y="440" width="580" height="64" rx="6" fill="#fff" stroke="#cbd4e2"/><text x="92" y="468" class="name" text-anchor="start">05  生态扩展</text><text x="92" y="492" class="sub" text-anchor="start">共建、共验、复用，分摊行业验证成本</text><line x1="40" y1="536" x2="680" y2="536" stroke="#cbd4e2"/><text x="40" y="560" class="sub" text-anchor="start">依据本书相应章节绘制 · 实线：主流程 / 支撑 · 虚线：反馈</text></svg></div></main></body></html>
